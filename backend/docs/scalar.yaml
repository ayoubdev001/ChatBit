{
  "openapi": "3.0.0",
  "info": {
    "title": "ChatBit API",
    "version": "1.0.0",
    "description": "Real-time customer support platform API"
  },
  "servers": [
    { "url": "http://localhost:3000/api" }
  ],
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    }
  },
  "paths": {
    "/auth/register": {
      "post": {
        "summary": "Register a new user",
        "tags": ["Auth"],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": ["fullname", "email", "password", "role"],
                "properties": {
                  "fullname": { "type": "string", "example": "Test User" },
                  "email": { "type": "string", "example": "test@test.com" },
                  "password": { "type": "string", "example": "1234" },
                  "role": { "type": "string", "enum": ["client", "agent"] }
                }
              }
            }
          }
        },
        "responses": {
          "201": { "description": "User created" },
          "409": { "description": "Email already in use" }
        }
      }
    },
    "/auth/login": {
      "post": {
        "summary": "Login and get a JWT",
        "tags": ["Auth"],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": ["email", "password"],
                "properties": {
                  "email": { "type": "string", "example": "test@test.com" },
                  "password": { "type": "string", "example": "1234" }
                }
              }
            }
          }
        },
        "responses": {
          "200": { "description": "Returns token + user" },
          "401": { "description": "Invalid credentials" }
        }
      }
    },
    "/users/me": {
      "get": {
        "summary": "Get the current authenticated user",
        "tags": ["Users"],
        "security": [{ "bearerAuth": [] }],
        "responses": {
          "200": { "description": "Returns the current user" },
          "401": { "description": "No or invalid token" },
          "404": { "description": "User not found" }
        }
      }
    },
    "/users/agents": {
      "get": {
        "summary": "List all agents",
        "tags": ["Users"],
        "security": [{ "bearerAuth": [] }],
        "responses": {
          "200": { "description": "Returns a list of agents" },
          "401": { "description": "No or invalid token" }
        }
      }
    },
    "/conversations": {
      "get": {
        "summary": "List conversations (filtered by role)",
        "tags": ["Conversations"],
        "security": [{ "bearerAuth": [] }],
        "responses": {
          "200": { "description": "Client sees their own conversations; agent sees pending + their own ongoing ones" },
          "401": { "description": "No or invalid token" }
        }
      },
"post": {
  "summary": "Create a new conversation (client only)",
  "tags": ["Conversations"],
  "security": [{ "bearerAuth": [] }],
  "requestBody": {
    "required": true,
    "content": {
      "application/json": {
        "schema": {
          "type": "object",
          "required": ["subject"],
          "properties": {
            "subject": { "type": "string", "example": "Order #123 not delivered" }
          }
        }
      }
    }
  },
  "responses": {
    "201": {
      "description": "Conversation created, unassigned until an agent joins via socket",
      "content": {
        "application/json": {
          "schema": {
            "type": "object",
            "properties": {
              "id": { "type": "integer", "example": 2 },
              "subject": { "type": "string", "example": "Order #123 not delivered" },
              "clientId": { "type": "integer", "example": 2 },
              "agentId": { "type": "integer", "nullable": true, "example": null },
              "status": { "type": "string", "enum": ["en_attente", "en_cours", "fermee"], "example": "en_attente" },
              "closedAt": { "type": "string", "nullable": true, "format": "date-time", "example": null },
              "createdAt": { "type": "string", "format": "date-time" },
              "updatedAt": { "type": "string", "format": "date-time" }
            }
          }
        }
      }
    },
    "400": { "description": "Missing subject" },
    "403": { "description": "Only clients can create conversations" }
  }
    },
    "/conversations/{id}/messages": {
      "get": {
        "summary": "Get paginated messages for a conversation",
        "tags": ["Conversations"],
        "security": [{ "bearerAuth": [] }],
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": { "type": "integer" }
          },
          {
            "name": "page",
            "in": "query",
            "required": false,
            "schema": { "type": "integer", "default": 1 }
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": { "type": "integer", "default": 20 }
          }
        ],
        "responses": {
          "200": { "description": "Returns paginated messages" },
          "403": { "description": "Not a participant in this conversation" },
          "404": { "description": "Conversation not found" }
        }
      }
    },
    "/conversations/{id}/close": {
      "patch": {
        "summary": "Close a conversation (assigned agent only)",
        "tags": ["Conversations"],
        "security": [{ "bearerAuth": [] }],
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": { "type": "integer" }
          }
        ],
        "responses": {
          "200": { "description": "Conversation closed" },
          "400": { "description": "Already closed" },
          "403": { "description": "Not assigned to this conversation" },
          "404": { "description": "Conversation not found" }
        }
      }
    }
  }
}